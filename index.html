      }

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How do you add two fractions?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Give both fractions the same denominator by scaling each to the lowest common denominator, add the numerators, then reduce the result by dividing the top and bottom by their greatest common divisor. For example 1/2 + 1/3 becomes 3/6 + 2/6 = 5/6."
            }
          },
          {
            "@type": "Question",
            "name": "How do you divide fractions?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Invert the second fraction (swap its numerator and denominator) and multiply. So 1/2 ÷ 1/4 = 1/2 × 4/1 = 4/2 = 2."
            }
          },
          {
            "@type": "Question",
            "name": "Can it handle mixed numbers?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Enter a mixed number like \"1 1/2\" with a space between the whole number and the fraction. It is converted to an improper fraction for the calculation and the answer is given both ways."
            }
          },
          {
            "@type": "Question",
            "name": "How are repeating decimals shown?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The repeating part is placed in brackets. 1/3 is shown as 0.(3) and 1/7 as 0.(142857). Terminating decimals like 3/8 = 0.375 are shown in full."
            }
          }
        ]
      }
    </script>
